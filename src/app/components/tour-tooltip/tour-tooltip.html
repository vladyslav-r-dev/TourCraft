<section
  class="tour-tooltip"
  aria-labelledby="tour-step-title"
  aria-describedby="tour-step-description"
>
  <div class="tooltip-meta">
    <span
      class="tooltip-symbol"
      aria-hidden="true"
    >
      &#10022;
    </span>
    <span>LET'S GET YOU STARTED</span>
    <span>{{ stepIndex() + 1 }} / {{ stepsCount() }}</span>
  </div>

  <h3
    id="tour-step-title"
    tabindex="-1"
  >
    {{ step().title }}
  </h3>
  <p id="tour-step-description">{{ step().description }}</p>

  <div
    class="tooltip-progress"
    role="progressbar"
    aria-label="Tour progress"
    [attr.aria-valuenow]="stepIndex() + 1"
    aria-valuemin="0"
    [attr.aria-valuemax]="stepsCount()"
  >
    <span [style.width.%]="stepsCount() ? ((stepIndex() + 1) / stepsCount()) * 100 : 0"></span>
  </div>

  <div class="tooltip-actions">
    <button
      class="btn btn-quiet"
      type="button"
      [disabled]="stepIndex() === 0"
      (click)="previousClicked.emit()"
    >
      Previous
    </button>

    <button
      class="btn btn-primary"
      type="button"
      (click)="nextClicked.emit()"
    >
      {{ stepIndex() === stepsCount() - 1 ? 'Finish' : 'Next' }}
      <span aria-hidden="true">&rarr;</span>
    </button>
  </div>
</section>
